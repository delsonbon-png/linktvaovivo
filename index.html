<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkTV Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&amp;display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#0a0a0f;color:#fff;min-height:100vh}
.screen{display:none!important;min-height:100vh;max-height:100vh}
.screen.active{display:flex!important;flex-direction:column}

/* AUTH */
#authScreen{justify-content:center;align-items:center;padding:24px;background:linear-gradient(160deg,#0a0a0f,#1a1030)}
.logo-box{text-align:center;margin-bottom:32px}
.logo-emoji{font-size:64px}
.app-name{font-size:36px;font-weight:800;color:#fff;letter-spacing:2px;margin-top:8px}
.tagline{font-size:14px;color:#7c6aff;margin-top:4px}
.card{background:#13131f;border-radius:24px;padding:28px;width:100%;max-width:400px;border:1px solid #ffffff12;box-shadow:0 0 40px #7c6aff22}
.tabs{display:flex;background:#0a0a14;border-radius:14px;padding:4px;margin-bottom:24px}
.tab{flex:1;padding:10px;border-radius:12px;border:none;background:transparent;color:#777;font-weight:600;font-size:15px;cursor:pointer;transition:.3s}
.tab.active{background:#7c6aff;color:#fff}
.input-group{margin-bottom:16px}
.label{color:#aaa;font-size:12px;margin-bottom:6px;font-weight:600;letter-spacing:1px;display:block}
input{background:#0d0d1a;border-radius:12px;padding:14px;color:#fff;font-size:16px;border:1px solid #ffffff18;width:100%;outline:none;font-family:inherit}
input:focus{border-color:#7c6aff}
.btn-main{background:#7c6aff;border-radius:14px;padding:16px;width:100%;border:none;color:#fff;font-weight:700;font-size:16px;cursor:pointer;margin-top:8px;box-shadow:0 4px 20px #7c6aff44;transition:.3s}
.btn-main:active{opacity:.8}
.btn-main.green{background:#25D366;box-shadow:0 4px 20px #25D36644}
.id-toggle{display:flex;background:#0a0a14;border-radius:10px;padding:3px;margin-bottom:12px;gap:2px}
.id-tab{flex:1;padding:7px;border-radius:8px;border:none;background:transparent;color:#777;font-weight:600;font-size:13px;cursor:pointer;transition:.3s}
.id-tab.active{background:#7c6aff44;color:#c8a8ff;border:1px solid #7c6aff55}

/* CATEGORIES */
.category-bar{display:flex;gap:8px;padding:12px 14px 4px;overflow-x:auto;white-space:nowrap;flex-shrink:0}
.category-bar::-webkit-scrollbar{display:none}
.cat-pill{background:#13131f;border:1px solid #ffffff14;border-radius:20px;padding:8px 16px;color:#ccc;font-weight:600;font-size:13px;cursor:pointer;transition:.2s}
.cat-pill.active{background:#7c6aff;color:#fff;border-color:#7c6aff}
.cat-select{background:#0d0d1a;border-radius:12px;padding:14px;color:#fff;font-size:15px;border:1px solid #ffffff18;width:100%;outline:none;font-family:inherit;appearance:none}
.cat-badge{font-size:10px;background:#2a1f4e;color:#c8a8ff;padding:2px 8px;border-radius:6px;display:inline-block;margin-top:4px;font-weight:700}
.admin-edit-input{background:#0d0d1a;border:1px solid #ffffff14;border-radius:8px;color:#fff;padding:8px 10px;font-size:14px;width:100%;margin-bottom:6px;outline:none}
.admin-edit-input:focus{border-color:#7c6aff}
.admin-edit-select{background:#0d0d1a;border:1px solid #ffffff14;border-radius:8px;color:#c8a8ff;padding:6px 10px;font-size:13px;width:100%;outline:none}

/* TOP BAR */
.top-bar{background:#0d0d1a;padding:16px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0a;padding-top:env(safe-area-inset-top,16px);flex-shrink:0}
.top-title{font-size:20px;font-weight:800;letter-spacing:2px}
.icon-btn{background:none;border:none;font-size:24px;cursor:pointer;padding:4px}

/* TV SCREEN */
#tvScreen{background:#0a0a0f;height:100vh;max-height:100vh;overflow:hidden}
.player-wrap{background:#000;width:100%;aspect-ratio:16/9;position:relative;display:flex;justify-content:center;align-items:center;flex-shrink:0}
video{width:100%;height:100%;object-fit:contain}
.now-playing{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#0d0d1a;border-bottom:1px solid #ffffff08;flex-shrink:0}
.live-badge{background:#ff4444;color:#fff;padding:2px 8px;border-radius:50px;font-size:10px;font-weight:800;letter-spacing:1px;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff444466}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.now-text{font-size:13px;color:#ccc;flex:1}
.search-row{display:flex;gap:8px;padding:8px 14px 4px;flex-shrink:0}
.search-box{flex:1;display:flex;align-items:center;background:#13131f;border-radius:12px;padding:0 12px;border:1px solid #ffffff14}
.search-box input{background:transparent;border:none;padding:10px 8px;font-size:14px}
.channel-list{flex:1;overflow-y:auto;padding:8px 14px 24px}
.channel-item{display:flex;align-items:center;background:#13131f;border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid #ffffff0a;cursor:pointer;gap:12px;transition:.2s}
.channel-item:active,.channel-item.active{border-color:#7c6aff;background:#1a1a2e}
.ch-icon{width:44px;height:44px;border-radius:10px;background:#0d0d1a;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.channel-item.active .ch-icon{background:#2a1f4e}
.ch-info{flex:1;min-width:0}
.ch-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del-btn{background:none;border:none;font-size:18px;cursor:pointer;padding:6px}
.dot{width:10px;height:10px;border-radius:5px;background:#7c6aff;flex-shrink:0}
.empty{text-align:center;padding:40px 20px;color:#444;font-size:15px}
.loading-spin{display:flex;justify-content:center;padding:40px}
.spinner{width:40px;height:40px;border:4px solid #ffffff15;border-top-color:#7c6aff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ADMIN & PROFILE */
#adminScreen,#userProfileScreen{background:#0a0a0f;overflow-y:auto}
.scroll-content{padding:16px;padding-bottom:40px}
.section{background:#13131f;border-radius:20px;padding:18px;margin-bottom:16px;border:1px solid #ffffff0a}
.section-title{font-weight:700;font-size:15px;margin-bottom:14px}
.row{display:flex;gap:10px}
.hint{color:#666;font-size:12px;line-height:1.6;margin-bottom:12px}
.ch-row{display:flex;align-items:center;background:#0d0d1a;border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid #ffffff08;gap:12px}
.ch-row-info{flex:1;min-width:0}
.back-btn{display:flex;align-items:center;gap:4px;background:none;border:none;color:#7c6aff;font-size:14px;font-weight:600;cursor:pointer}
.user-row{display:flex;align-items:center;background:#0d0d1a;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #ffffff08;gap:10px}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e1e2e;color:#fff;padding:12px 20px;border-radius:50px;font-size:14px;font-weight:500;border:1px solid #ffffff15;box-shadow:0 8px 32px #00000055;transition:transform .4s cubic-bezier(.16,1,.3,1),opacity .4s;opacity:0;z-index:999;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.ok{border-color:#55efc466}
#toast.err{border-color:#ff6b6b66}
#toast.loading{border-color:#7c6aff66}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen" class="screen active" style="">
  <div class="logo-box">
    <div class="logo-emoji">📺</div>
    <div class="app-name">Link TV</div>
    <div class="tagline">Sua TV ao vivo</div>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="switchTab('login')">Entrar</button>
      <button class="tab" id="tabRegister" onclick="switchTab('register')">Cadastrar</button>
    </div>
    <div id="nameGroup" class="input-group" style="display:none">
      <label class="label">NOME</label>
      <input type="text" id="nameInput" placeholder="Seu nome completo">
    </div>
    <div class="input-group">
      <div class="id-toggle">
        <button class="id-tab active" id="tabCpf" onclick="switchIdType('cpf')">CPF</button>
        <button class="id-tab" id="tabCelular" onclick="switchIdType('celular')">Celular</button>
      </div>
      <label class="label" id="idLabel">CPF</label>
      <input type="text" id="cpfInput" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" oninput="formatIdInput(this)">
    </div>
    <div class="input-group">
      <label class="label">SENHA</label>
      <input type="password" id="passInput" placeholder="Digite sua senha">
    </div>
    <button class="btn-main" id="authBtn" onclick="handleAuth()">Entrar</button>
  </div>
</div>

<!-- TV SCREEN -->
<div id="tvScreen" class="screen" style="">
  <div class="top-bar">
    <span class="top-title">Link TV</span>
    <button class="icon-btn" onclick="goProfile()" title="Perfil">👤</button>
  </div>
  <div class="player-wrap" id="playerWrap">
    <div id="playerEmpty" style="text-align: center; display: block;">
      <div style="font-size:48px">📺</div>
      <div style="color:#555;margin-top:8px">Selecione um canal</div>
    </div>
    <video id="videoEl" style="display:none" controls="" playsinline="" src=""></video>
    <iframe id="ytFrame" style="display: none; width: 100%; height: 100%; border-width: medium; border-style: none; border-color: currentcolor; border-image: none;" allowfullscreen="" allow="autoplay; encrypted-media" src="https://www.youtube.com/embed/WLwpLy86DUw?autoplay=1&amp;rel=0"></iframe>
  </div>
  <div class="now-playing" id="nowPlaying" style="display: none;">
    <span class="live-badge">AO VIVO</span>
    <span class="now-text" id="nowText">Bob Esponja</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:10px 14px 4px;flex-shrink:0">
    <span style="font-size:13px;color:#888;font-weight:600;white-space:nowrap">📂 Categoria:</span>
    <select id="categorySelect" onchange="setCategory(this.value)" style="flex:1;background:#13131f;color:#fff;border:1px solid #7c6aff55;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;outline:none;cursor:pointer;font-family:inherit">
      <option value="Todos">🔵 Todos</option>
      <option value="Tv Aberta">📡 Tv Aberta</option>
      <option value="Documentários">🎞 Documentários</option>
      <option value="Filmes">🎬 Filmes</option>
      <option value="Esportes">⚽ Esportes</option>
      <option value="Kids">🧒 Kids</option>
      <option value="Notícias">📰 Notícias</option>
      <option value="Variedades">🎭 Variedades</option>
      <option value="Outros">📦 Outros</option>
    </select>
  </div>
  <div class="search-row">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Pesquisar canal..." oninput="onSearchInput(this.value)">
    </div>
  </div>
  <div class="channel-list" id="channelListEl"></div>
</div>

<!-- ADMIN SCREEN -->
<div id="adminScreen" class="screen" style="">
  <div class="top-bar">
    <button class="back-btn" onclick="goBack()">‹ Voltar</button>
    <span class="top-title" style="font-size:16px">Painel Admin</span>
    <button class="icon-btn" onclick="logout()" title="Sair" style="font-size:14px;color:#ff6b6b;font-weight:700;background:#1a0a0a;border:1px solid #ff6b6b33;border-radius:10px;padding:6px 10px">🚪 Sair</button>
  </div>
  <div class="scroll-content">
    <div class="section" style="background:linear-gradient(135deg,#2a1f4e,#13131f);border-color:#7c6aff55">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="section-title" style="margin-bottom:4px;color:#c8a8ff">🌐 Publicar na Web</div>
          <div style="font-size:12px;color:#aaa">Atualizar index.html (App2)</div>
        </div>
        <button onclick="publishAppToGithub()" style="background:#7c6aff;border:none;border-radius:12px;padding:10px 16px;color:#fff;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 15px #7c6aff44">Publicar</button>
      </div>
    </div>
    <div class="section">
      <div class="section-title">➕ Adicionar Canal</div>
      <div class="input-group"><label class="label">NOME DO CANAL</label><input type="text" id="newChName" placeholder="Ex: Globo HD"></div>
      <div class="input-group"><label class="label">LINK</label><input type="text" id="newChUrl" placeholder="https://" inputmode="url" autocapitalize="none"></div>
      <div class="input-group">
        <label class="label">CATEGORIA</label>
        <select id="newChCat" class="cat-select" style="padding-right: 32px; background-image: url('data:image/svg+xml;utf8,&lt;svg fill=%22%23fff%22 height=%2224%22 viewBox=%220 0 24 24%22 width=%2224%22 xmlns=%22http://www.w3.org/2000/svg%22&gt;&lt;path d=%22M7 10l5 5 5-5z%22/&gt;&lt;/svg&gt;'); background-repeat: no-repeat; background-position-x: 96%; background-position-y: center;">
          <option value="Tv Aberta">Tv Aberta</option>
          <option value="Documentários">Documentários</option>
          <option value="Filmes">Filmes</option>
          <option value="Esportes">Esportes</option>
          <option value="Kids">Kids</option>
          <option value="Notícias">Notícias</option>
          <option value="Variedades">Variedades</option>
          <option value="Outros">Outros</option>
        </select>
      </div>
      <button class="btn-main" onclick="addChannel()">Adicionar Canal</button>
    </div>
    <div class="section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div class="section-title" style="margin:0" id="chCountTitle">📋 Canais (0)</div>
        <button onclick="loadAdminData()" style="background:none;border:none;color:#7c6aff;font-size:13px;cursor:pointer">Atualizar</button>
      </div>
      <div id="adminChList"></div>
    </div>
    <div class="section">
      <div class="section-title" id="usersTitle">👥 Usuários (0)</div>
      <div id="adminUserList"></div>
    </div>
  </div>
</div>

<!-- USER PROFILE SCREEN -->
<div id="userProfileScreen" class="screen" style="">
  <div class="top-bar">
    <button class="back-btn" onclick="showScreen('tvScreen')">‹ Voltar</button>
    <span class="top-title" style="font-size:16px">Meu Perfil</span>
    <button onclick="logout()" style="font-size:14px;color:#ff6b6b;font-weight:700;background:#1a0a0a;border:1px solid #ff6b6b33;border-radius:10px;padding:6px 10px;cursor:pointer;border-style:solid">🚪 Sair</button>
  </div>
  <div class="scroll-content">
    <div class="section">
      <div class="section-title">👤 Minhas Informações</div>
      <div class="ch-row">
        <div class="ch-row-info">
          <div class="ch-name">Nome</div>
          <div id="profName" style="color:#7c6aff;font-size:13px;margin-top:2px"></div>
        </div>
      </div>
      <div class="ch-row">
        <div class="ch-row-info">
          <div class="ch-name" id="profIdLabel">CPF</div>
          <div id="profCpf" style="color:#7c6aff;font-size:13px;margin-top:2px"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── CONSTANTS ──
const ADMIN_CPF = '09131915663';
const ADMIN_PASS = '132435';
const GH_OWNER = 'delsonbon-png';
const GH_REPO = 'linktvaovivo';
const GH_FILE = 'canais.json';
const GH_USERS_FILE = 'usuarios.json';
const GH_TOKEN = 'ghp_' + 'eyz9E02MDo' + 'M1pEieQIkn' + 'IegUqqVdlk1t6YnV';
const DEFAULT_CHANNELS = [];

// ── STORAGE ──
function getUsers(){
  const data=localStorage.getItem('lt_users');
  const users=data?JSON.parse(data):[];
  if(!users.find(u=>u.cpf===ADMIN_CPF)){
    users.unshift({cpf:ADMIN_CPF,password:ADMIN_PASS,name:'Administrador',isAdmin:true});
    localStorage.setItem('lt_users',JSON.stringify(users));
  }
  return users;
}
function saveUsers(u){localStorage.setItem('lt_users',JSON.stringify(u));}
function getSession(){const d=localStorage.getItem('lt_session');return d?JSON.parse(d):null;}
function saveSession(u){localStorage.setItem('lt_session',JSON.stringify(u));}
function clearSession(){localStorage.removeItem('lt_session');}
function getChannels(){
  const d=localStorage.getItem('lt_channels');
  if(d===null) return DEFAULT_CHANNELS;
  return JSON.parse(d);
}
function saveChannels(c){localStorage.setItem('lt_channels',JSON.stringify(c));}
function getGhToken(){return GH_TOKEN;}
function getGhSha(){return localStorage.getItem('lt_gh_sha')||null;}
function saveGhSha(s){if(s)localStorage.setItem('lt_gh_sha',s);}
function getGhUsersSha(){return localStorage.getItem('lt_gh_users_sha')||null;}
function saveGhUsersSha(s){if(s)localStorage.setItem('lt_gh_users_sha',s);}

// ── HELPERS ──
let currentUser=null;
let channels=[];
let selectedChannel=null;
let hls=null;
let ghSha=null;
let ghUsersSha=null;
let currentCategory = 'Todos';

let idType='cpf'; 

function switchIdType(type){
  idType=type;
  document.getElementById('tabCpf').classList.toggle('active',type==='cpf');
  document.getElementById('tabCelular').classList.toggle('active',type==='celular');
  const input=document.getElementById('cpfInput');
  const label=document.getElementById('idLabel');
  if(type==='cpf'){
    label.textContent='CPF';
    input.placeholder='000.000.000-00';
    input.maxLength=14;
    input.value='';
  } else {
    label.textContent='CELULAR';
    input.placeholder='(00) 9 0000-0000';
    input.maxLength=16;
    input.value='';
  }
}

function formatIdInput(el){
  if(idType==='cpf') el.value=formatCPF(el.value);
  else el.value=formatPhone(el.value);
}
function formatCPF(v){
  const d=v.replace(/\D/g,'').slice(0,11);
  return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,'$1.$2.$3-$4');
}
function formatPhone(v){
  const d=v.replace(/\D/g,'').slice(0,11);
  if(d.length<=2) return d.replace(/(\d{2})/,'($1)');
  if(d.length<=6) return d.replace(/(\d{2})(\d+)/,'($1) $2');
  if(d.length<=11) return d.replace(/(\d{2})(\d{5})(\d+)/,'($1) $2-$3');
  return d.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3');
}
function displayPhone(raw){ return formatPhone(raw); }
function rawCPF(v){return v.replace(/\D/g,'');}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>{ s.classList.remove('active'); s.style.cssText=''; });
  const el=document.getElementById(id);
  if(el) el.classList.add('active');
}

// ── AUTH ──
let authMode='login';
function switchTab(mode){
  authMode=mode;
  document.getElementById('tabLogin').classList.toggle('active',mode==='login');
  document.getElementById('tabRegister').classList.toggle('active',mode==='register');
  document.getElementById('nameGroup').style.display=mode==='register'?'block':'none';
  document.getElementById('authBtn').textContent=mode==='login'?'Entrar':'Criar conta';
}

async function fetchRemoteUsers(){
  try{
    const res=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_USERS_FILE}?ref=main&_=${Date.now()}`);
    if(res.ok){
      const data=await res.json();
      if(data.content){
        const decoded=JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g,'')))));
        if(Array.isArray(decoded)){
          if(!decoded.find(u=>u.cpf===ADMIN_CPF)){
            decoded.unshift({cpf:ADMIN_CPF,password:ADMIN_PASS,name:'Administrador',isAdmin:true});
          }
          saveUsers(decoded);
          saveGhUsersSha(data.sha);
          ghUsersSha=data.sha;
          return decoded;
        }
      }
    }
  }catch(e){}
  return getUsers();
}

async function handleAuth(){
  const rawId=rawCPF(document.getElementById('cpfInput').value);
  const pass=document.getElementById('passInput').value;
  const minLen=idType==='cpf'?11:11;
  if(authMode==='login'){
    if(!rawId||!pass){alert('Preencha todos os campos.');return;}
    let users=await fetchRemoteUsers();
    const user=users.find(u=>u.cpf===rawId&&u.password===pass);
    if(!user){alert('Credenciais incorretas.');return;}
    saveSession(user);
    currentUser=user;
    enterApp();
  } else {
    const name=document.getElementById('nameInput').value.trim();
    if(!rawId||!pass||!name){alert('Preencha os campos.');return;}
    if(rawId.length<minLen){alert('CPF ou Celular inválido.');return;}
    let users=await fetchRemoteUsers();
    if(users.find(u=>u.cpf===rawId)){alert('Usuário já existe.');return;}
    users.push({cpf:rawId,password:pass,name,isAdmin:false,idType});
    saveUsers(users);
    alert('Cadastrado com sucesso!');
    autoSyncUsers(users);
    switchTab('login');
  }
}

function enterApp(){
  showScreen('tvScreen');
  loadChannels();
}

function goProfile(){
  if(currentUser?.isAdmin){
    loadAdminData();
    showScreen('adminScreen');
  } else {
    document.getElementById('profName').textContent=currentUser?.name||'Usuário';
    const uIdType=currentUser?.idType||'cpf';
    document.getElementById('profIdLabel').textContent=uIdType==='celular'?'Celular':'CPF';
    document.getElementById('profCpf').textContent=uIdType==='celular'?displayPhone(currentUser?.cpf||''):formatCPF(currentUser?.cpf||'');
    showScreen('userProfileScreen');
  }
}

function goBack(){
  showScreen('tvScreen');
  filterChannels();
}

function logout(){
  if(confirm('Deseja sair da conta?')){
    clearSession();
    currentUser=null;
    selectedChannel=null;
    if(hls){hls.destroy();hls=null;}
    showScreen('authScreen');
    toast('Sessão encerrada.','ok');
  }
}

// ── CHANNELS FRONTEND ──
async function loadChannels(){
  const listEl=document.getElementById('channelListEl');
  listEl.innerHTML='<div class="loading-spin"><div class="spinner"></div></div>';
  try{
    const res=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=main&_=${Date.now()}`);
    if(res.ok){
      const data=await res.json();
      if(data.content){
        const decoded=JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g,'')))));
        if(decoded&&decoded.length){
          channels=decoded;
          saveChannels(channels);
          saveGhSha(data.sha);
          ghSha=data.sha;
        }else channels=getChannels();
      }else channels=getChannels();
    }else channels=getChannels();
  }catch(e){channels=getChannels();}
  
  filterChannels();
  // Se abrir e nao tiver canal selecionado, toca o primeiro visivel (se houver)
  if(channels.length && !selectedChannel){
    const sorted = [...channels].sort((a,b)=>a.name.localeCompare(b.name));
    playChannel(sorted[0]);
  }
}

function setCategory(cat){
  currentCategory = cat;
  const sel = document.getElementById('categorySelect');
  if(sel && sel.value !== cat) sel.value = cat;
  filterChannels();
}

function onSearchInput(q){
  filterChannels();
}

function filterChannels(){
  const q = document.getElementById('searchInput').value;
  const f = q.trim().toLowerCase();
  
  let list = channels.filter(c => {
    // Fallback pra canais velhos sem categoria (são Tv Aberta por padrão visual e lógica)
    let cat = c.category || 'Tv Aberta';
    if(currentCategory !== 'Todos' && cat !== currentCategory) return false;
    if(f && !c.name.toLowerCase().includes(f)) return false;
    return true;
  });
  
  // Ordem Alfabética
  list.sort((a,b) => a.name.localeCompare(b.name));
  
  renderChannelsRaw(list);
}

function renderChannelsRaw(list){
  const el=document.getElementById('channelListEl');
  const isAdmin=currentUser?.isAdmin;
  if(!list.length){el.innerHTML='<div class="empty">📺 Nenhum canal encontrado</div>';return;}
  
  el.innerHTML=list.map(ch=>{
    const cat = ch.category || 'Tv Aberta';
    return `
    <div class="channel-item ${selectedChannel?.id===ch.id?'active':''}" id="chi_${ch.id}" onclick="playChannel(${JSON.stringify(ch).replace(/"/g,'&quot;')})">
      <div class="ch-icon">📺</div>
      <div class="ch-info">
        <div class="ch-name">${ch.name}</div>
        <div class="cat-badge">${cat}</div>
      </div>
      ${isAdmin?`<button class="del-btn" onclick="event.stopPropagation();adminDelCh('${ch.id}')">🗑️</button>`:''}
      ${selectedChannel?.id===ch.id&&!isAdmin?'<div class="dot"></div>':''}
    </div>`
  }).join('');
}

function getYouTubeId(url){
  const rx=/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|live\/|embed\/)|youtu\.be\/)([\w-]{11})/;
  const m=url.match(rx);
  return m?m[1]:null;
}

function playChannel(ch){
  if(typeof ch==='string')ch=JSON.parse(ch);
  selectedChannel=ch;
  document.getElementById('nowPlaying').style.display='flex';
  document.getElementById('nowText').textContent=ch.name;
  document.getElementById('playerEmpty').style.display='none';
  const video=document.getElementById('videoEl');
  const ytFrame=document.getElementById('ytFrame');
  if(hls){hls.destroy();hls=null;}

  const ytId=getYouTubeId(ch.url);
  if(ytId){
    video.style.display='none';
    video.src='';
    ytFrame.style.display='block';
    ytFrame.src='https://www.youtube.com/embed/'+ytId+'?autoplay=1&rel=0';
  } else {
    ytFrame.style.display='none';
    ytFrame.src='';
    video.style.display='block';
    if(Hls.isSupported()){
      hls=new Hls();
      hls.loadSource(ch.url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
    }else if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src=ch.url;
      video.play().catch(()=>{});
    }
  }
  filterChannels(); // re-render para mostrar dot do canal ativo
}

// ── ADMIN ──

  // Render canais em Ordem Alfabética e Editáveis
  const sorted = [...channels].sort((a,b) => a.name.localeCompare(b.name));
  
  document.getElementById('adminChList').innerHTML=sorted.length?sorted.map(c=>{
    const cat = c.category || 'Tv Aberta';
    return `
    <div class="ch-row">
      <div class="ch-row-info">
        <input type="text" id="edit_name_${c.id}" value="${c.name}" class="admin-edit-input" placeholder="Nome">

          <select id="edit_cat_${c.id}" class="admin-edit-select">
            <option value="Tv Aberta" ${cat=='Tv Aberta'?'selected':''}>Tv Aberta</option>
            <option value="Documentários" ${cat=='Documentários'?'selected':''}>Documentários</option>
            <option value="Filmes" ${cat=='Filmes'?'selected':''}>Filmes</option>
            <option value="Esportes" ${cat=='Esportes'?'selected':''}>Esportes</option>
            <option value="Kids" ${cat=='Kids'?'selected':''}>Kids</option>
            <option value="Notícias" ${cat=='Notícias'?'selected':''}>Notícias</option>
            <option value="Variedades" ${cat=='Variedades'?'selected':''}>Variedades</option>
            <option value="Outros" ${cat=='Outros'?'selected':''}>Outros</option>
          </select>
          <button onclick="adminSaveCh('${c.id}')" style="background:#2a1f4e;border:1px solid #7c6aff55;border-radius:8px;padding:4px 12px;color:#fff;font-size:16px;cursor:pointer" title="Salvar Alterações">💾</button>
        </div>
        <div style="color:#555;font-size:11px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.url}</div>
      </div>
      <button onclick="adminDelCh('${c.id}')" style="background:#ff444433;border:1px solid #ff444455;border-radius:10px;padding:8px 12px;color:#ff6b6b;font-size:16px;cursor:pointer;flex-shrink:0" title="Apagar">🗑</button>
    </div>`
  }).join(''):'<div style="color:#444;text-align:center;padding:16px">Nenhum canal</div>';
  
  const users=await fetchRemoteUsers();
  document.getElementById('usersTitle').textContent=`👥 Usuários (${users.length})`;
  document.getElementById('adminUserList').innerHTML=users.map(function(u){
    const idInfo=u.idType==='celular'?'Celular: '+displayPhone(u.cpf):'CPF: '+u.cpf;
    const delBtn=u.isAdmin?'':'<button onclick="adminDelUser(\''+u.cpf+'\')" style="background:#ff444433;border:1px solid #ff444455;border-radius:10px;padding:8px 12px;color:#ff6b6b;font-size:16px;cursor:pointer;flex-shrink:0">🗑️</button>';
    return '<div class="user-row"><div style="flex:1"><div class="ch-name">'+u.name+(u.isAdmin?' (Admin)':'')+'</div><div style="color:#888;font-size:11px;margin-top:2px">'+idInfo+'</div></div>'+delBtn+'</div>';
  }).join('');
}

function adminSaveCh(id){
  const name = document.getElementById('edit_name_'+id).value.trim();
  const cat = document.getElementById('edit_cat_'+id).value;
  const idx = channels.findIndex(c=>c.id===id);
  if(idx > -1){
    channels[idx].name = name;
    channels[idx].category = cat;
    saveChannels(channels);
    toast('Canal salvo e ordenado!','ok');
    autoSync(channels);
    loadAdminData(); // realoca ordem alfabetica
  }
}

function adminDelCh(id){
  if(!confirm('Certeza que deseja remover este canal?')) return;
  channels=channels.filter(c=>c.id!==id);
  saveChannels(channels);
  if(selectedChannel?.id===id){selectedChannel=null;}
  autoSync(channels);
  loadAdminData();
  filterChannels(); 
}

async function adminDelUser(cpf){
  if(cpf===ADMIN_CPF){alert('Administrador raiz intocável.');return;}
  if(!confirm('Remover usuário? Esta ação não pode ser desfeita.'))return;
  const users=getUsers().filter(u=>u.cpf!==cpf);
  saveUsers(users);
  autoSyncUsers(users);
  loadAdminData();
}

function addChannel(){
  const name=document.getElementById('newChName').value.trim();
  const url=document.getElementById('newChUrl').value.trim();
  const category=document.getElementById('newChCat').value;
  
  if(!name||!url){toast('Informe nome e link.','err');return;}
  if(!url.startsWith('http')){toast('Link inválido.','err');return;}
  
  const chs=getChannels();
  chs.push({id:Date.now().toString(), name, url, category});
  saveChannels(chs);
  channels=chs;
  
  document.getElementById('newChName').value='';
  document.getElementById('newChUrl').value='';
  autoSync(chs);
  loadAdminData();
  toast('Canal Adicionado!','ok');
}

// ── TOAST / SYNC ──
let toastTimer;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='show '+(type||'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.className='';},3500);
}

async function autoSyncUsers(userList){
  const token=getGhToken();
  if(!token) return;
  try{
    const check=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_USERS_FILE}?ref=main&_=${Date.now()}`,{ headers:{'Authorization':'token '+token} });
    if(check.ok){const d=await check.json();ghUsersSha=d.sha;saveGhUsersSha(d.sha);}
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(userList||getUsers(),null,2))));
    const body={message:'LinkTV: atualizar usuarios',content,branch:'main'};
    if(ghUsersSha)body.sha=ghUsersSha;
    const res=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_USERS_FILE}`,{
      method:'PUT', headers:{'Authorization':'token '+token,'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    const data=await res.json();
    if(res.ok){ ghUsersSha=data.content?.sha; saveGhUsersSha(ghUsersSha); }
  }catch(e){}
}

async function autoSync(list){
  const token=getGhToken();
  if(!token) return;
  try{
    const check=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=main&_=${Date.now()}`,{ headers:{'Authorization':'token '+token} });
    if(check.ok){const d=await check.json();ghSha=d.sha;saveGhSha(d.sha);}
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(list||channels,null,2))));
    const body={message:'LinkTV: atualizar canais',content,branch:'main'};
    if(ghSha)body.sha=ghSha;
    const res=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`,{
      method:'PUT', headers:{'Authorization':'token '+token,'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    const data=await res.json();
    if(res.ok){ ghSha=data.content?.sha; saveGhSha(ghSha); }
  }catch(e){}
}

async function publishAppToGithub(){
  const token=getGhToken();
  if(!token){toast('GitHub Token não encontrado.','err');return;}
  if(!confirm('Pública nova versão html?'))return;
  try{
    const clone = document.documentElement.cloneNode(true);
    clone.querySelectorAll('.screen').forEach(s => { s.classList.remove('active'); s.style.cssText = ''; });
    const auth = clone.querySelector('#authScreen');
    if(auth) auth.classList.add('active');

    const chList = clone.querySelector('#channelListEl'); if(chList) chList.innerHTML = '';
    const adChList = clone.querySelector('#adminChList'); if(adChList) adChList.innerHTML = '';
    const adUserList = clone.querySelector('#adminUserList'); if(adUserList) adUserList.innerHTML = '';
    
    const uTitle = clone.querySelector('#usersTitle'); if(uTitle) uTitle.textContent = '👥 Usuários (0)';
    const cTitle = clone.querySelector('#chCountTitle'); if(cTitle) cTitle.textContent = '📋 Canais (0)';
    clone.querySelector('#videoEl').style.display = 'none';
    clone.querySelector('#ytFrame').style.display = 'none';
    clone.querySelector('#playerEmpty').style.display = 'block';
    clone.querySelector('#nowPlaying').style.display = 'none';

    clone.querySelectorAll('input').forEach(i => { i.removeAttribute('value'); i.textContent = ''; });

    const htmlContent = "<!DOCTYPE html>\n" + clone.outerHTML;
    
    let sha = null;
    const check=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/index.html?ref=main&_=${Date.now()}`,{ headers:{'Authorization':'token '+token} });
    if(check.ok){ const d=await check.json(); sha=d.sha; }
    
    const body={ message:'LinkTV: update app2 web', content:btoa(unescape(encodeURIComponent(htmlContent))), branch:'main' };
    if(sha) body.sha = sha;
    
    const res=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/index.html`,{
      method:'PUT', headers:{'Authorization':'token '+token,'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    
    if(res.ok){ alert('App publicado!'); } else { alert('Erro ao publicar'); }
  }catch(e){ alert('Erro de conexão'); }
}
